name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Team calendar sync tests
        run: node tests/sync-team-calendar.test.cjs
      - name: Publish my time off tests
        run: node tests/publish-my-time-off.test.cjs
      - name: Reconciliation tests
        run: node tests/reconciliation.test.cjs
